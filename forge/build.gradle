plugins {
    id 'multiloader-loader'
    id 'net.minecraftforge.gradle'
}

base {
    archivesName = "${mod_name}-forge-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

sourceSets.main.resources { srcDir 'src/generated/resources' }

minecraft {
    runs {
        configureEach {
            systemProperty 'eventbus.api.strictRuntimeChecks', 'true'
        }
        register('client') {
            workingDir = layout.projectDirectory.dir('runs/client')
            if (org.gradle.internal.os.OperatingSystem.current().isMacOsX()) {
                jvmArgs '-XstartOnFirstThread'
            }
        }
        register('server') {
            workingDir = layout.projectDirectory.dir('runs/server')
            args '--nogui'
        }
        register('data') {
            workingDir = layout.projectDirectory.dir('runs/data')
            args '--mod', mod_id, '--all',
                 '--output', layout.projectDirectory.dir('src/generated/resources'),
                 '--existing', layout.projectDirectory.dir('src/main/resources')
        }
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${minecraft_version}-${forge_version}")
    annotationProcessor 'net.minecraftforge:eventbus-validator:7.0.1'
}

jar {
    manifest {
        attributes([
            'Specification-Title'   : mod_id,
            'Specification-Vendor'  : mod_author,
            'Specification-Version' : '1',
            'Implementation-Title'  : mod_name,
            'Implementation-Version': version,
            'Implementation-Vendor' : mod_author,
            'MixinConfigs'          : 'slice.client.mixins.json',
            'MixinConnector'        : 'com.ansi.slice.SliceMixinConnector',
        ])
    }
}

sourceSets.configureEach {
    def dir = layout.buildDirectory.dir("sourcesSets/$name")
    output.resourcesDir = dir
    java.destinationDirectory = dir
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

processResources {
    inputs.property 'version', version
    inputs.property 'mod_id', mod_id
    inputs.property 'mod_name', mod_name
    filesMatching('META-INF/mods.toml') {
        expand(
            'mod_id'           : mod_id,
            'mod_name'         : mod_name,
            'version'          : version,
            'minecraft_version': minecraft_version,
            'forge_version'    : forge_version
        )
    }
}