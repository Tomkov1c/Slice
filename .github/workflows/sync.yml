name: Sync files

on:
  workflow_dispatch:
    inputs:
      sync_funding:
        description: 'Sync .github/FUNDING.yml'
        type: boolean
        default: false
      sync_links:
        description: 'Sync gradle.properties links'
        type: boolean
        default: false
      sync_readme:
        description: 'Sync README.md'
        type: boolean
        default: false
      sync_publish_workflow:
        description: 'Sync .github/workflows/publish.yml'
        type: boolean
        default: false
      sync_sync_workflow:
        description: 'Sync .github/workflows/sync.yml'
        type: boolean
        default: false
      sync_issue_templates:
        description: 'Sync .github/ISSUE_TEMPLATE/*'
        type: boolean
        default: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "${{ secrets.GIT_USER_NAME }}"
          git config user.email "${{ secrets.GIT_USER_EMAIL }}"

      - name: Cache files to sync
        run: |
          mkdir -p /tmp/sync/issue_templates

          if [ "${{ inputs.sync_funding }}" = "true" ]; then
            cp .github/FUNDING.yml /tmp/sync/FUNDING.yml
          fi

          if [ "${{ inputs.sync_links }}" = "true" ]; then
            grep -E '^[a-zA-Z_]+=https?://' gradle.properties > /tmp/sync/links.txt
          fi

          if [ "${{ inputs.sync_readme }}" = "true" ]; then
            cp README.md /tmp/sync/README.md
          fi

          if [ "${{ inputs.sync_publish_workflow }}" = "true" ]; then
            cp .github/workflows/publish.yml /tmp/sync/publish.yml
          fi

          if [ "${{ inputs.sync_sync_workflow }}" = "true" ]; then
            cp .github/workflows/sync.yml /tmp/sync/sync.yml
          fi

          if [ "${{ inputs.sync_issue_templates }}" = "true" ]; then
            if [ -d .github/ISSUE_TEMPLATE ]; then
              cp -r .github/ISSUE_TEMPLATE/* /tmp/sync/issue_templates/
              echo "::notice::Cached issue templates"
            fi
          fi

      - name: Sync to all other branches
        run: |
          SOURCE_BRANCH="${{ github.ref_name }}"
          branches=$(git branch -r | grep -v 'HEAD' | grep -v "origin/$SOURCE_BRANCH" | sed 's/origin\///')

          for branch in $branches; do
            echo "::group::$branch"
            git checkout "$branch" 2>&1
            changed_files=""

            # Function to stage a file and track it if changed
            sync_file() {
              local src=$1
              local dest=$2
              mkdir -p "$(dirname "$dest")"
              cp "$src" "$dest"
              if ! git diff --quiet "$dest"; then
                changed_files="$changed_files $dest"
              fi
            }

            # --- FUNDING.yml ---
            [ "${{ inputs.sync_funding }}" = "true" ] && sync_file /tmp/sync/FUNDING.yml .github/FUNDING.yml

            # --- Workflows ---
            [ "${{ inputs.sync_publish_workflow }}" = "true" ] && sync_file /tmp/sync/publish.yml .github/workflows/publish.yml
            [ "${{ inputs.sync_sync_workflow }}" = "true" ] && sync_file /tmp/sync/sync.yml .github/workflows/sync.yml

            # --- ISSUE_TEMPLATES ---
            if [ "${{ inputs.sync_issue_templates }}" = "true" ]; then
              for template in /tmp/sync/issue_templates/*; do
                [ -e "$template" ] || continue
                filename=$(basename "$template")
                sync_file "$template" ".github/ISSUE_TEMPLATE/$filename"
              done
            fi

            # --- gradle.properties links ---
            if [ "${{ inputs.sync_links }}" = "true" ] && [ -f gradle.properties ]; then
              while IFS= read -r link_line; do
                key=$(echo "$link_line" | cut -d'=' -f1)
                if grep -q "^${key}=" gradle.properties; then
                  sed -i "s|^${key}=.*|${link_line}|" gradle.properties
                else
                  echo "$link_line" >> gradle.properties
                fi
              done < /tmp/sync/links.txt
              git diff --quiet gradle.properties || changed_files="$changed_files gradle.properties"
            fi

            # --- README.md ---
            [ "${{ inputs.sync_readme }}" = "true" ] && sync_file /tmp/sync/README.md README.md

            # Commit each changed file separately
            branch_pushed=false
            for f in $changed_files; do
              git add "$f"
              git commit -m "[CHORE] Sync $(basename $f) from $SOURCE_BRANCH"
              branch_pushed=true
            done

            if [ "$branch_pushed" = "true" ]; then
              git push origin "$branch"
              echo "::notice::Synced changes to $branch"
            else
              echo "::notice::No changes for $branch"
            fi

            echo "::endgroup::"
          done