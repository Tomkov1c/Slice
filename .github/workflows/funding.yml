name: Sync FUNDING.yml

on:
  workflow_dispatch:
  push:
    branches:
      - $default-branch
    paths:
      - '.github/FUNDING.yml'

jobs:
  sync-funding:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "${{ secrets.GIT_USER_NAME }}"
          git config user.email "${{ secrets.GIT_USER_EMAIL }}"

      - name: Cache FUNDING.yml from source branch
        run: |
          mkdir -p /tmp/github-funding
          cp .github/FUNDING.yml /tmp/github-funding/FUNDING.yml
          echo "::notice::Cached FUNDING.yml from \`${{ github.ref_name }}\`"

      - name: Sync FUNDING.yml to all other branches
        run: |
          SOURCE_BRANCH="${{ github.ref_name }}"

          branches=$(git branch -r | grep -v 'HEAD' | grep -v "origin/$SOURCE_BRANCH" | sed 's/origin\///')
          branch_count=$(echo "$branches" | grep -c '\S' || true)

          echo "::notice::Syncing FUNDING.yml from \`$SOURCE_BRANCH\` to $branch_count branch(es)"

          synced=0
          skipped=0

          for branch in $branches; do
            echo "::group::$branch"

            git checkout "$branch" 2>&1
            mkdir -p .github
            cp /tmp/github-funding/FUNDING.yml .github/FUNDING.yml

            if git diff --quiet .github/FUNDING.yml; then
              echo "::notice::No changes — skipping"
              skipped=$((skipped + 1))
            else
              git add .github/FUNDING.yml
              git commit -m "[CHORE] Sync \`FUNDING.yml\` from $SOURCE_BRANCH"
              git push origin "$branch"
              echo "::notice::Pushed successfully"
              synced=$((synced + 1))
            fi

            echo "::endgroup::"
          done

          echo ""
          echo "::notice::Done — $synced synced, $skipped skipped"