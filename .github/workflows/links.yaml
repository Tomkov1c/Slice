name: Sync gradle.properties Links

on:
  workflow_dispatch:
  push:
    branches:
      - $default-branch
    paths:
      - 'gradle.properties'

jobs:
  sync-links:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "${{ secrets.GIT_USER_NAME }}"
          git config user.email "${{ secrets.GIT_USER_EMAIL }}"

      - name: Extract links from gradle.properties
        run: |
          grep -E '^[a-zA-Z_]+=https?://' gradle.properties > /tmp/links.txt
          link_count=$(wc -l < /tmp/links.txt)
          echo "::notice::Found $link_count link(s) to sync:"
          while IFS= read -r line; do
            echo "  $line"
          done < /tmp/links.txt

      - name: Sync links to all other branches
        run: |
          SOURCE_BRANCH="${{ github.ref_name }}"

          branches=$(git branch -r | grep -v 'HEAD' | grep -v "origin/$SOURCE_BRANCH" | sed 's/origin\///')
          branch_count=$(echo "$branches" | grep -c '\S' || true)

          echo "::notice::Syncing gradle.properties links from \`$SOURCE_BRANCH\` to $branch_count branch(es)"

          synced=0
          skipped=0
          missing=0

          for branch in $branches; do
            echo "::group::$branch"

            git checkout "$branch" 2>&1

            if [ ! -f gradle.properties ]; then
              echo "::warning::No gradle.properties found — skipping"
              missing=$((missing + 1))
              echo "::endgroup::"
              continue
            fi

            while IFS= read -r link_line; do
              key=$(echo "$link_line" | cut -d'=' -f1)
              if grep -q "^${key}=" gradle.properties; then
                sed -i "s|^${key}=.*|${link_line}|" gradle.properties
              else
                echo "$link_line" >> gradle.properties
              fi
            done < /tmp/links.txt

            if git diff --quiet gradle.properties; then
              echo "::notice::No changes — skipping"
              skipped=$((skipped + 1))
            else
              git add gradle.properties
              git commit -m "[CHORE] Sync links in \`gradle.properties\` from $SOURCE_BRANCH"
              git push origin "$branch"
              echo "::notice::Pushed successfully"
              synced=$((synced + 1))
            fi

            echo "::endgroup::"
          done

          echo ""
          echo "::notice::Done — $synced synced, $skipped skipped, $missing missing"