name: Sync gradle.properties Links

on:
  workflow_dispatch:
  push:
    branches:
      - $default-branch
    paths:
      - 'gradle.properties'

jobs:
  sync-links:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync links in gradle.properties to all other branches
        run: |
          git config user.name "${{ secrets.GIT_USER_NAME }}"
          git config user.email "${{ secrets.GIT_USER_EMAIL }}"

          SOURCE_BRANCH="${{ github.ref_name }}"

          # Extract the link lines from the source gradle.properties
          # Matches lines like: key=https://...
          grep -E '^[a-zA-Z_]+=https?://' gradle.properties > /tmp/links.txt
          echo ">>> Links to sync:"
          cat /tmp/links.txt

          branches=$(git branch -r | grep -v 'HEAD' | grep -v "origin/$SOURCE_BRANCH" | sed 's/origin\///')

          for branch in $branches; do
            echo ">>> Processing branch: $branch"
            git checkout "$branch"

            if [ ! -f gradle.properties ]; then
              echo "No gradle.properties found on $branch, skipping."
              continue
            fi

            # For each link key=value from source, replace the matching line in target
            changed=false
            while IFS= read -r link_line; do
              key=$(echo "$link_line" | cut -d'=' -f1)
              # Replace the line with this key if it exists, otherwise append it
              if grep -q "^${key}=" gradle.properties; then
                sed -i "s|^${key}=.*|${link_line}|" gradle.properties
              else
                echo "$link_line" >> gradle.properties
              fi
              changed=true
            done < /tmp/links.txt

            if git diff --quiet gradle.properties; then
              echo "No changes needed for $branch, skipping."
            else
              git add gradle.properties
              git commit -m "[CHORE] Sync links in `gradle.properties` from $SOURCE_BRANCH"
              git push origin "$branch"
              echo "gradle.properties links pushed to $branch"
            fi
          done