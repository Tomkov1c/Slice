name: Sync README

on:
  workflow_dispatch:
  push:
    branches:
      - $default-branch
    paths:
      - 'README.md'

jobs:
  sync-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "${{ secrets.GIT_USER_NAME }}"
          git config user.email "${{ secrets.GIT_USER_EMAIL }}"

      - name: Copy README to all other branches
        run: |
          SOURCE_BRANCH="${{ github.ref_name }}"
          cp README.md /tmp/README.md

          branches=$(git branch -r | grep -v 'HEAD' | grep -v "origin/$SOURCE_BRANCH" | sed 's/origin\///')
          branch_count=$(echo "$branches" | grep -c '\S' || true)

          echo "::notice::Syncing README.md from \`$SOURCE_BRANCH\` to $branch_count branch(es)"

          synced=0
          skipped=0

          for branch in $branches; do
            echo "::group::$branch"

            git checkout "$branch" 2>&1
            cp /tmp/README.md README.md

            if git diff --quiet README.md; then
              echo "::notice::No changes — skipping"
              skipped=$((skipped + 1))
            else
              git add README.md
              git commit -m "[CHORE] Sync \`README.md\` from $SOURCE_BRANCH"
              git push origin "$branch"
              echo "::notice::Pushed successfully"
              synced=$((synced + 1))
            fi

            echo "::endgroup::"
          done

          echo ""
          echo "::notice::Done — $synced synced, $skipped skipped"