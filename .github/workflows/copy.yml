name: Sync README

on:
  workflow_dispatch:
  push:
    branches:
      - $default-branch
    paths:
      - 'README.md'

jobs:
  copy-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Copy README to all other branches
        run: |
          git config user.name "${{ secrets.GIT_USER_NAME }}"
          git config user.email "${{ secrets.GIT_USER_EMAIL }}"

          # Save README from the branch the workflow was triggered on
          SOURCE_BRANCH="${{ github.ref_name }}"
          cp README.md /tmp/README.md

          # Get all remote branches except the source
          branches=$(git branch -r | grep -v 'HEAD' | grep -v "origin/$SOURCE_BRANCH" | sed 's/origin\///')

          for branch in $branches; do
            echo ">>> Processing branch: $branch"

            git checkout "$branch"
            cp /tmp/README.md README.md

            if git diff --quiet README.md; then
              echo "No changes needed for $branch, skipping."
            else
              git add README.md
              git commit -m "Chore: sync README from $SOURCE_BRANCH"
              git push origin "$branch"
              echo "README pushed to $branch"
            fi
          done